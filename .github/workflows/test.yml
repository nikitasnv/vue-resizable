name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run eslint:check -- --ext .js,.mjs,.vue src docs tests vite.config.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
